<header class="header">

      <img src="assets/logo.png">

  <main class="wrap">
    <h1>Listado de Propiedades Disponibles</h1>
    <p class="sub">Propiedades verificadas y listas para negociar. Agenda una visita por WhatsApp o entra a ver los detalles.</p>
    <div class="listing-toolbar">

  <select id="sortProps">

    <option value="recent">
      Más recientes
    </option>

    <option value="low">
      Menor precio
    </option>

    <option value="high">
      Mayor precio
    </option>

  </select>

</div>
<div class="filters">

  <input
    type="text"
    id="searchInput"
    placeholder="Buscar propiedad..."
  >

  <select id="typeFilter">
    <option value="">Todos los tipos</option>
    <option value="Apartamento">Apartamento</option>
    <option value="Casa">Casa</option>
    <option value="Townhouse">Townhouse</option>
    <option value="Local">Local</option>
  </select>

  <input
    type="number"
    id="priceFilter"
    placeholder="Precio máximo"
  >

</div>
    <section id="dynamicProps" class="grid-3">
      
    </section>
<div id="pagination" class="pagination"></div>
    
  </main>

  <script src="assets/js/listado.js"></script>
